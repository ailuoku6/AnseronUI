name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  ANSERONUI_DEBUG_BUILD: '1'

jobs:
  unit:
    name: Shared contracts and tooling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prepare:tools
      - run: npm test
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-unit
          path: .verification/tests/unit
          if-no-files-found: warn

  runtime:
    name: ${{ matrix.suite }} runtime
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [layout, native, wasm, web, ios, macos]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.15.2'
      - run: npm ci --ignore-scripts
      - run: npm run test:ci -- ${{ matrix.suite }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-${{ matrix.suite }}
          path: |
            .verification/tests/${{ matrix.suite }}/
            .verification/layout/summary.json
            .verification/layout/*.stderr
            .verification/performance/*.json
          if-no-files-found: warn

  android-build:
    name: Android APK and test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANSERONUI_ANDROID_ABI: arm64-v8a
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Override v3's default "tools platform-tools": the legacy tools
          # package is no longer available from the Android SDK repository.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.15.2'
      - run: npm ci --ignore-scripts
      - run: npm run test:ci -- android-build
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-android-build
          path: |
            .verification/tests/android-build/
            examples/native/android/app/build/outputs/apk/
          if-no-files-found: warn

  # HarmonyOS still needs a configured device runner. Android uses a hosted AVD.
  device-config:
    name: Check device runner configuration
    runs-on: ubuntu-latest
    outputs:
      harmony: ${{ steps.config.outputs.harmony }}
    steps:
      - id: config
        env:
          HARMONY_ENABLED: ${{ vars.ANSERONUI_HARMONY_CI }}
        run: |
          echo "harmony=$HARMONY_ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$HARMONY_ENABLED" != true ]; then
            echo 'Full device coverage requires ANSERONUI_HARMONY_CI=true plus a matching HarmonyOS runner.' >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    name: Android device renderer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANSERONUI_ANDROID_ABI: x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.15.2'
      - run: npm ci --ignore-scripts
      - name: Install LLVM 22 for Android async AOT
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg > /dev/null
          codename=$(lsb_release -cs)
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-22
          clang-22 --version
      - name: Build x86_64 APK before starting emulator
        run: |
          npm run prepare:compiler
          npm run build:android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Test on Android API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: npm run test:ci -- android
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-android-device
          path: |
            .verification/tests/android/
            examples/native/android/app/build/reports/androidTests/
            examples/native/android/app/build/outputs/androidTest-results/
          if-no-files-found: warn

  harmony:
    name: HarmonyOS device renderer
    needs: device-config
    if: needs.device-config.outputs.harmony == 'true' && github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64, anseronui-harmony]
    timeout-minutes: 90
    concurrency:
      group: anseronui-harmony-device
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:ci -- harmony
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-harmony-device
          path: |
            .verification/tests/harmony/
            .verification/harmony/acceptance/
            .verification/harmony/virtual-list/
          if-no-files-found: warn

  complete:
    name: Full test gate
    if: always()
    needs: [unit, runtime, android-build, device-config, android, harmony]
    runs-on: ubuntu-latest
    steps:
      - env:
          UNIT: ${{ needs.unit.result }}
          RUNTIME: ${{ needs.runtime.result }}
          ANDROID_BUILD: ${{ needs.android-build.result }}
          ANDROID: ${{ needs.android.result }}
          HARMONY: ${{ needs.harmony.result }}
          EVENT: ${{ github.event_name }}
        run: |
          failed=0
          for result in "$UNIT" "$RUNTIME" "$ANDROID_BUILD" "$ANDROID"; do
            if [ "$result" != success ]; then failed=1; fi
          done
          if [ "$EVENT" = pull_request ]; then
            echo 'Android emulator tests run on hosted runners. HarmonyOS device tests run on push and manual dispatch.' >> "$GITHUB_STEP_SUMMARY"
          else
            for result in "$HARMONY"; do
              if [ "$result" != success ]; then failed=1; fi
            done
          fi
          printf 'Shared: %s; runtimes: %s; Android build: %s; Android device: %s; Harmony device: %s\n' "$UNIT" "$RUNTIME" "$ANDROID_BUILD" "$ANDROID" "$HARMONY" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -ne 0 ]; then
            echo 'Tests failed or device coverage is incomplete. See job logs and docs/contributing/testing.md.'
            exit 1
          fi
