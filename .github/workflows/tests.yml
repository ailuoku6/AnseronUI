name: Tests

on:
  push:
    # Release tags run these same tests through Publish, once per release.
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  ANSERONUI_DEBUG_BUILD: '1'

jobs:
  unit:
    name: Shared contracts and tooling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prepare:tools
      - run: npm test
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-unit
          path: .verification/tests/unit
          if-no-files-found: warn

  runtime:
    name: ${{ matrix.suite }} runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: layout
            os: ubuntu-latest
          - suite: native
            os: ubuntu-latest
          - suite: wasm
            os: ubuntu-latest
          - suite: web
            os: ubuntu-latest
          - suite: ios
            os: macos-15
          - suite: macos
            os: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: mlugg/setup-zig@v2
        if: matrix.suite != 'web'
        with:
          version: '0.15.2'
      - run: npm ci --ignore-scripts
      - name: Install WebKit and system dependencies
        if: matrix.suite == 'web'
        run: npx --no-install playwright install --with-deps webkit
      - run: npm run test:ci -- ${{ matrix.suite }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-${{ matrix.suite }}
          path: |
            .verification/tests/${{ matrix.suite }}/
            .verification/browser/*/result.json
            .verification/browser/*/failure.json
            .verification/browser/*/failure.png
            .verification/browser/*/trace.zip
            .verification/layout/summary.json
            .verification/layout/*.stderr
            .verification/performance/*.json
          if-no-files-found: warn

  android-build:
    name: Android APK and test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANSERONUI_ANDROID_ABI: arm64-v8a
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Override v3's default "tools platform-tools": the legacy tools
          # package is no longer available from the Android SDK repository.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.15.2'
      - run: npm ci --ignore-scripts
      - run: npm run test:ci -- android-build
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-android-build
          path: |
            .verification/tests/android-build/
            examples/native/android/app/build/outputs/apk/
          if-no-files-found: warn

  # HarmonyOS still needs a configured device runner. Android uses a hosted AVD.
  device-config:
    name: Check device runner configuration
    runs-on: ubuntu-latest
    outputs:
      harmony: ${{ steps.config.outputs.harmony }}
    steps:
      - id: config
        env:
          HARMONY_ENABLED: ${{ vars.ANSERONUI_HARMONY_CI }}
        run: |
          echo "harmony=$HARMONY_ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$HARMONY_ENABLED" != true ]; then
            echo 'HarmonyOS device tests are optional and will be skipped. Enable ANSERONUI_HARMONY_CI with a matching runner to execute them.' >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    name: Android device renderer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANSERONUI_ANDROID_ABI: x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
      - name: Verify KVM acceleration
        shell: bash
        run: |
          mkdir -p .verification
          bash .github/scripts/android-kvm.sh 2>&1 | tee .verification/android-kvm.log
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.15.2'
      - run: npm ci --ignore-scripts
      - name: Install LLVM 22 for Android async AOT
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg > /dev/null
          codename=$(lsb_release -cs)
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-22
          clang-22 --version
      - name: Build x86_64 APK before starting emulator
        run: |
          npm run prepare:compiler
          npm run build:android
      - name: Test on Android API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -accel on -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: npm run test:ci -- android
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-android-device
          path: |
            .verification/android-kvm.log
            .verification/tests/android/
            examples/native/android/app/build/reports/androidTests/
            examples/native/android/app/build/outputs/androidTest-results/
          if-no-files-found: warn

  harmony:
    name: HarmonyOS device renderer
    needs: device-config
    if: needs.device-config.outputs.harmony == 'true' && github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64, anseronui-harmony]
    timeout-minutes: 90
    concurrency:
      group: anseronui-harmony-device
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:ci -- harmony
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-harmony-device
          path: |
            .verification/tests/harmony/
            .verification/harmony/acceptance/
            .verification/harmony/virtual-list/
          if-no-files-found: warn

  complete:
    name: Full test gate
    if: always()
    needs: [unit, runtime, android-build, device-config, android, harmony]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check all test job results
        env:
          TEST_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/test-gate.mjs
