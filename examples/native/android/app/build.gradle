plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'org.anseronui.demo'
    compileSdk 35
    defaultConfig {
        applicationId 'org.anseronui.demo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.assets.srcDirs += rootProject.file('../../components/assets')
    signingConfigs {
        release {
            def signingValues = ['ANSERONUI_ANDROID_KEYSTORE', 'ANSERONUI_ANDROID_STORE_PASSWORD', 'ANSERONUI_ANDROID_KEY_ALIAS', 'ANSERONUI_ANDROID_KEY_PASSWORD'].collect { System.getenv(it) }
            if (signingValues.any { it }) {
                if (!signingValues.every { it }) throw new GradleException('Set all ANSERONUI_ANDROID_KEYSTORE, ANSERONUI_ANDROID_STORE_PASSWORD, ANSERONUI_ANDROID_KEY_ALIAS and ANSERONUI_ANDROID_KEY_PASSWORD values to sign the release build.')
                if (!file(signingValues[0]).isFile()) throw new GradleException("Android keystore not found: ${signingValues[0]}")
                storeFile file(signingValues[0]); storePassword signingValues[1]; keyAlias signingValues[2]; keyPassword signingValues[3]
            }
        }
    }
    buildTypes { release { if (System.getenv('ANSERONUI_ANDROID_KEYSTORE')) signingConfig signingConfigs.release; minifyEnabled false } }
}
dependencies { implementation project(':render'); androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }

// AnseronUI app icon integration
def appIconConfig = rootProject.file('../../../.anseronui/icons/android.gradle')
if (appIconConfig.exists()) apply from: appIconConfig
