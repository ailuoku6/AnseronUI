plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'org.anseronui.demo'
    compileSdk 35
    defaultConfig {
        applicationId 'org.anseronui.demo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.assets.srcDirs += rootProject.file('../../components/assets')
}
dependencies { implementation project(':render'); androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }
